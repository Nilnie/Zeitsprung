name: Android-APK bauen

on:
  push:
    branches: ["**"]
    paths: ["index.html", "android/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # Standard wäre "tools", das Paket gibt es nicht mehr.
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Spiel in die App kopieren
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html

      - name: APK bauen
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Zeitsprung.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Zeitsprung-APK
          path: Zeitsprung.apk

      # Immer die neueste APK unter einem festen Download-Link bereitstellen.
      - name: Als Release "Zeitsprung-App" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app Zeitsprung.apk \
            --target "${{ github.sha }}" \
            --title "Zeitsprung-App (Android)" \
            --notes "Neueste Android-Version von Zeitsprung (Build ${{ github.run_number }}). Auf dem Handy die Datei Zeitsprung.apk antippen, herunterladen und installieren."
